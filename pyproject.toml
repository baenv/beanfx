# Test and coverage settings only; beanfx is a Claude Code plugin, not a Python package.
[tool.pytest.ini_options]
testpaths = ["plugins/beanfx/skills/beanfx/tests"]
# the tests are scripts: tests/conftest.py runs each as one test, so pytest's own module import is switched off
python_files = ["__scripts_run_through_conftest__"]
addopts = "-ra"

[tool.coverage.run]
source = ["plugins/beanfx/skills/beanfx"]
omit = ["*/tests/*"]

[tool.coverage.report]
# CI fails below this; raise it as tests are added (89% when it was last raised; gate.py and pfx.py are the gaps)
fail_under = 80
