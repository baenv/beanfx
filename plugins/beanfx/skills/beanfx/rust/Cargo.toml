[package]
name = "beanfx"
version = "1.0.0"
edition = "2021"
description = "The fixed tooling of the /beanfx skill: sheet export and checks, sound, preview writers"
license = "MIT"
publish = false

[features]
default = ["export", "sfx", "preview"]
export = []
sfx = []
preview = []

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
png = "0.17"
gif = "0.13"

[profile.release]
opt-level = 3
