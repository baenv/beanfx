name: release

# Pushing a tag v<version> publishes a GitHub release with that version's section of CHANGELOG.md.
# Running it by hand (workflow_dispatch) on main does the same for the version in plugin.json, creating the tag
# v<version> on the run's commit; it fails when that tag already exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the tag matches plugin.json
        run: |
          p=$(python3 -c "import json; print(json.load(open('plugins/beanfx/.claude-plugin/plugin.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            [ "${tag#v}" = "$p" ] || { echo "tag $tag but plugin.json says $p"; exit 1; }
          else
            [ "$GITHUB_REF_NAME" = main ] || { echo "run it on main, not $GITHUB_REF_NAME"; exit 1; }
            tag="v$p"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then echo "$tag exists"; exit 1; fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: notes from CHANGELOG.md
        run: |
          v="${TAG#v}"
          awk -v v="$v" '/^## /{on = ($2 == v)} on' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
