name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install numpy pillow pytest pytest-cov
      - uses: dtolnay/rust-toolchain@stable
      - name: the beanfx binary (the skill's rust/) and its unit tests
        working-directory: plugins/beanfx/skills/beanfx/rust
        run: |
          cargo test --locked
          cargo build --release --locked
          echo "BEANFX_BIN=$PWD/target/release/beanfx" >> "$GITHUB_ENV"
      - name: skill tests (one test per check in every tests/test_*.py and test_*.mjs; coverage floor)
        run: pytest --cov --cov-report=term-missing   # fails under fail_under in pyproject.toml
      - name: the demo page's runtime is the skill's runtime
        run: cmp plugins/beanfx/skills/beanfx/runtime/beanfx.js docs/beanfx.js
      - name: media budget (docs/ at most 8 MB, one file at most 5 MB)
        run: |
          total=$(du -sk docs | cut -f1)
          big=$(find docs -type f -size +5M)
          echo "docs: ${total} kB"
          [ -z "$big" ] || { echo "over 5 MB: $big"; exit 1; }
          [ "$total" -le 8192 ] || { echo "docs/ is over 8 MB; drop a gif that no page links, or host it on the site"; exit 1; }
