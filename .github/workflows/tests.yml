name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: the kit crate (the skill's kit/) and the beanfx binary, with a line coverage floor
        working-directory: plugins/beanfx/skills/beanfx/kit
        run: cargo llvm-cov --locked --fail-under-lines 85   # 89 percent when set; the parity tests skip here (their cases are not committed)
      - name: the example draft builds on its pinned kit
        working-directory: drafts/hoa_cong_v2
        run: cargo check --locked
      - name: the browser runtime
        run: node plugins/beanfx/skills/beanfx/tests/test_runtime.mjs
      - name: the demo page's runtime is the skill's runtime
        run: cmp plugins/beanfx/skills/beanfx/runtime/beanfx.js docs/beanfx.js
      - name: media budget (docs/ at most 8 MB, one file at most 5 MB)
        run: |
          total=$(du -sk docs | cut -f1)
          big=$(find docs -type f -size +5M)
          echo "docs: ${total} kB"
          [ -z "$big" ] || { echo "over 5 MB: $big"; exit 1; }
          [ "$total" -le 8192 ] || { echo "docs/ is over 8 MB; drop a gif that no page links, or host it on the site"; exit 1; }
